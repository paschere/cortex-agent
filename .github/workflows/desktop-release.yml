# Desktop Release Workflow
#
# Triggers:
#   - workflow_dispatch: manual run from GitHub Actions UI
#   - release (created): when a GitHub release is published (e.g., tag "desktop-v0.1.0")
#
# Required GitHub Secrets (configure in Settings → Secrets → Actions):
# ─────────────────────────────────────────────────────────────────────
# Tauri updater signing (REQUIRED for update delivery; generate once with
#   `pnpm --filter @zipdev/desktop tauri signer generate`):
#   TAURI_SIGNING_PRIVATE_KEY          – base64-encoded private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD – passphrase for that key
#
# macOS code-signing & notarization (OPTIONAL for MVP; without them users
#   see "unidentified developer" Gatekeeper warnings):
#   APPLE_CERTIFICATE          – base64-encoded .p12 exported from Keychain
#   APPLE_CERTIFICATE_PASSWORD – password for that .p12
#   APPLE_SIGNING_IDENTITY     – e.g. "Developer ID Application: Zipdev (XXXXXXXXXX)"
#   APPLE_ID                   – Apple ID email used for notarization
#   APPLE_PASSWORD             – App-specific password for that Apple ID
#   APPLE_TEAM_ID              – 10-character Apple Developer team ID
#
# Windows Authenticode signing (OPTIONAL for MVP; without it SmartScreen warns):
#   WINDOWS_CERTIFICATE          – base64-encoded .pfx
#   WINDOWS_CERTIFICATE_PASSWORD – password for that .pfx
# ─────────────────────────────────────────────────────────────────────

name: Desktop release

on:
  workflow_dispatch: {}
  release:
    types: [created]

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be set up before setup-node so the 'cache: pnpm' option works
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: 'pnpm'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── macOS: import signing certificate (skipped when secret is absent) ──
      - name: Import Apple certificate
        if: matrix.os == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set — building unsigned."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      # ── Build + bundle + attach to release ──────────────────────────────────
      - name: Tauri build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — tauri-action skips signing if this is empty
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing & notarization (optional; empty → unsigned build)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing (optional; empty → unsigned build)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # When triggered by a release event, attach artifacts to that release.
          # tagName and releaseName are ignored when the release already exists,
          # but tauri-action uses them to find / create the release draft.
          tagName: ${{ github.ref_name }}
          releaseName: 'Zipdev Agent ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
